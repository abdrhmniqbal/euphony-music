# Purpose: Manually creates Android development APKs with Gradle.
# Caller: GitHub Actions workflow_dispatch.
# Dependencies: actions/checkout, setup-node, Corepack, setup-java, Gradle cache, Android Gradle project.
# Main Functions: Install dependencies with pnpm, sync Expo config into Android native project, build Android debug APK through Gradle, upload APK artifact.
# Side Effects: Generates Android debug APK files and uploads workflow artifacts.

name: Development Build

on:
  workflow_dispatch:

jobs:
  development-build:
    name: Build Android Development APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.EXPO_PUBLIC_LASTFM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup Corepack package managers
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@11.5.1 --activate
          corepack prepare yarn@4.13.0 --activate

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Expo Android project
        run: pnpm expo prebuild --platform android

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: development-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
