# Purpose: Runs lint and unit tests on every push and pull request.
# Caller: GitHub Actions on push to master and pull requests.
# Dependencies: actions/checkout, setup-node, Corepack, nubjs/setup-nub, nub toolchain.
# Main Functions: Install dependencies, run oxlint, run vitest.
# Side Effects: None (read-only checks; no artifacts published).

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Corepack package managers
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@11.5.1 --activate
          corepack prepare yarn@4.13.0 --activate

      - name: Setup Nub toolkit
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile --node-linker hoisted

      - name: Lint
        run: nub run lint

      - name: Test
        run: nub run test
