# Purpose: Manually creates Android development APKs with Gradle.
# Caller: GitHub Actions workflow_dispatch.
# Dependencies: actions/checkout, oven-sh/setup-bun, setup-java, Gradle cache, Android Gradle project.
# Main Functions: Install dependencies with nub, build Android debug APK through Gradle, upload APK artifact.
# Side Effects: Generates Android debug APK files and uploads workflow artifacts.

name: Development Build

on:
  workflow_dispatch:

jobs:
  development-build:
    name: Build Android Development APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_VARIANT: dev
      EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.EXPO_PUBLIC_LASTFM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: temurin

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native bindings
        run: |
          cd node_modules/react-native-audio-browser
          bun codegen/index.js --logLevel="debug"
          bun post-script.cjs

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: development-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
