# Purpose: Runs lint and unit tests on every push and pull request.
# Caller: GitHub Actions on push to master and pull requests.
# Dependencies: actions/checkout, oven-sh/setup-bun, bun toolchain.
# Main Functions: Install dependencies, run oxlint, run vitest.
# Side Effects: None (read-only checks; no artifacts published).

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
