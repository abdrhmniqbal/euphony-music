# hoisted keeps node_modules flat so Gradle/Metro/native codegen behave like a
# standard install; switch to isolated only after verifying the native toolchain.
nodeLinker: hoisted

# react-native-audio-browser is git-hosted; its prepare script must be allowed to run.
allowBuilds:
  esbuild: true
  react-native-audio-browser@https://codeload.github.com/MissingCore/react-native-audio-browser/tar.gz/05f7af440edc29222d12a0acc58234f5cb51433d: true

patchedDependencies:
  react-native-android-widget: patches/react-native-android-widget.patch

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
