# Purpose: Runs lint and unit tests on every push and pull request.
# Caller: GitHub Actions on push to master and pull requests.
# Dependencies: actions/checkout, pnpm/action-setup, setup-node, pnpm toolchain.
# Main Functions: Install dependencies, run oxlint, run vitest.
# Side Effects: None (read-only checks; no artifacts published).

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
