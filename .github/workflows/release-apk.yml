# Purpose: Builds signed Android release APKs, creates a draft GitHub Release, and delegates release note attachment.
# Caller: GitHub tag pushes and manual workflow_dispatch runs.
# Dependencies: actions/checkout, setup-nub, setup-java, Gradle cache, Android Gradle project, release signing secrets.
# Main Functions: Resolve release tag, derive app version, build universal and ABI APKs, upload artifacts, create draft release.
# Side Effects: Generates signed APK files, uploads workflow artifacts, creates or updates a draft GitHub Release.

name: Android APK Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.2.3 or v1.2.3-rc.1)"
        required: true
        type: string

jobs:
  build-apk:
    name: Build Signed APK and Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolve_release_tag.outputs.release_tag }}
    env:
      RELEASE_CRED: ${{ secrets.RELEASE_CRED }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.EXPO_PUBLIC_LASTFM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nub toolkit
        uses: nubjs/setup-nub@v0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Resolve release tag
        id: resolve_release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${RELEASE_TAG}"

      - name: Derive app version from tag
        run: |
          node <<'NODE'
          const tag = process.env.RELEASE_TAG || ''
          const match = tag.match(/^v(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?$/)

          if (!match) {
            console.error(`Invalid tag format: "${tag}"`)
            console.error('Expected: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N')
            process.exit(1)
          }

          const major = Number.parseInt(match[1], 10)
          const minor = Number.parseInt(match[2], 10)
          const patch = Number.parseInt(match[3], 10)
          const rcRaw = match[4] ? Number.parseInt(match[4], 10) : null

          // Keep stable > rc for the same MAJOR.MINOR.PATCH.
          // Example:
          // - v1.2.3-rc.1 => 1020301
          // - v1.2.3      => 1020399
          const baseCode = major * 1000000 + minor * 10000 + patch * 100
          const suffix = rcRaw === null ? 99 : Math.min(rcRaw, 98)
          const versionCode = baseCode + suffix
          const versionName = tag.slice(1)

          const fs = require('node:fs')
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION_NAME=${versionName}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION_CODE=${versionCode}\n`)

          console.log(`Resolved versionName=${versionName}`)
          console.log(`Resolved versionCode=${versionCode}`)
          NODE

      - name: Apply version to app config
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const versionName = process.env.APP_VERSION_NAME
          const versionCode = process.env.APP_VERSION_CODE

          // Update Expo app version in app.json
          const appJsonPath = 'app.json'
          const appJson = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'))
          appJson.expo = appJson.expo || {}
          appJson.expo.version = versionName
          fs.writeFileSync(appJsonPath, `${JSON.stringify(appJson, null, 2)}\n`)

          // Update native Android version fields
          const gradlePath = 'android/app/build.gradle'
          const originalGradle = fs.readFileSync(gradlePath, 'utf8')
          let nextGradle = originalGradle
            .replace(/versionCode\s+\d+/, `versionCode ${versionCode}`)
            .replace(/versionName\s+"[^"]*"/, `versionName "${versionName}"`)

          if (nextGradle === originalGradle) {
            console.error('Failed to update versionCode/versionName in android/app/build.gradle')
            process.exit(1)
          }

          fs.writeFileSync(gradlePath, nextGradle)
          NODE

      - name: Show resolved versions
        run: |
          echo "Tag: ${RELEASE_TAG}"
          echo "Version name: ${APP_VERSION_NAME}"
          echo "Version code: ${APP_VERSION_CODE}"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Write Android signing config
        if: ${{ env.RELEASE_CRED != '' }}
        run: |
          echo "${RELEASE_CRED}" >> android/gradle.properties

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          fileDir: android/app
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd android
          chmod +x gradlew

          DIST_DIR="app/build/outputs/apk/dist"
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_PREFIX="startune-music-${RELEASE_TAG}"
          ./gradlew clean :app:assembleRelease --build-cache -Pandroid.enableAbiSplits=true
          mkdir -p "${DIST_DIR}"
          rm -f "${DIST_DIR}"/*.apk

          copy_generated_apk() {
            local label="$1"
            local matches=("${RELEASE_DIR}"/app-"${label}"-release*.apk)

            if [ "${#matches[@]}" -eq 0 ]; then
              echo "No APK found for ${label}"
              exit 1
            fi

            cp "${matches[0]}" "${DIST_DIR}/${APK_PREFIX}-${label}.apk"
          }

          for apk_label in universal armeabi-v7a arm64-v8a x86 x86_64; do
            copy_generated_apk "${apk_label}"
          done

          echo "Generated APKs:"
          ls -lah "${DIST_DIR}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/dist/*.apk

      - name: Collect release APK files
        id: collect_apk
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/dist/*.apk)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK files found in android/app/build/outputs/apk/dist/"
            exit 1
          fi

          echo "Found APK files:"
          printf '%s\n' "${apks[@]}"

          {
            echo 'apk_files<<EOF'
            printf '%s\n' "${apks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release draft with APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.collect_apk.outputs.apk_files }}
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') }}
          generate_release_notes: false
